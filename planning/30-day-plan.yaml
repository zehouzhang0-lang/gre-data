execution_rules:
  - 每个数量都是当日目标；未完成要记录为 debt，不得静默标成完成。
  - 原图范围 30-40 题固定取 35，6-8 篇固定取 7；20-30 题固定取 25，6-7 篇固定取 6。
  - 原图模考 1-2 套固定取下限 1 套；必须完整计时并记录来源。
  - 正序词表只查词；每日学习使用乱序词表。
  - text_completion 与 quant 的 question_range 指从 PDF 正文起按阅读顺序计数的全局序号，不等于各 test 或 section 内重复出现的印刷题号；执行记录必须补充实际 test、section 与页码。
  - 题库答案缺失时标记 answer_source: unavailable，不得伪造判分。
  - 每次题目训练后都要写原子记录并完成错题分析。
