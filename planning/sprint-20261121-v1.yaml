    evidence_required:
    - 题型分开的原答/用时/证据/错因、未讲完题目队列
    range: 先完成已派诊断未讲完题；新题按本次错因选相近难度且未做的最小题号，开练前冻结题目清单，按content_id去重。Quant图像题另由用户标重复。
  - id: 2026-12-11-03-quantitative
    order: 3
    key: quantitative
    title: Quant
    duration_min: 35
    material_id: quant_900
    material_status: available_answer_external_not_present
    target: 只修最可重复的失分
    action: 35分钟块6题/约11分钟作答；45–60分钟块8–12题/14–21分钟作答，余时核原页独立推导。轮换算术、代数、几何、数据分析，覆盖QC、单选、多选、填数、DI。
    output: 条件/范围/单位/所求、原答、草稿、用时与核验推导
    success: 无标准键标coach_solved须有完整推导；不能核验仍null。QC检验合法边界，D给两个反例；每次写有效检查动作。
    evidence_required:
    - 条件/范围/单位/所求、原答、草稿、用时与核验推导
    range: 先完成已派诊断未讲完题；新题按本次错因选相近难度且未做的最小题号，开练前冻结题目清单，按content_id去重。Quant图像题另由用户标重复。
  - id: 2026-12-11-04-analytical_writing
    order: 4
    key: analytical_writing
    title: AW短练
    duration_min: 30
    material_id: coach_issue_exercises
    material_status: available
    target: 只修最可重复的失分
    action: 10分钟写立场和两条推理；15–20分钟写一段claim→reason→example→implication；30–40分钟含提纲、主体段和反方边界修订。已写题优先修前次2–3项问题。
    output: 独立提纲或主体段、针对性局部修订
    success: 论点回应任务，例子解释为什么支持；短练不打全文分，不背整篇范文。
    evidence_required:
    - 独立提纲或主体段、针对性局部修订
    range: 使用platform/server/writing-topics.mjs中6道coach_original；全文依次用未做题，短练可修订已写题并标revision。
  - id: 2026-12-11-05-error_retest
    order: 5
    key: error_retest
    title: 复测
    duration_min: 45
    material_id: null
