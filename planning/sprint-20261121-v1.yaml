    target: 只修最可重复的失分
    action: 从已核验错因选3–6题，遮住旧答案先重答；解释关键证据，再用同类未见题检验迁移。优先次日、约3天与约7天的间隔复测，实际队列以事件为准。
    output: 原答、用时、同类错因是否再现、technique_ids和证据引用
    success: 旧题记忆与未见题迁移分开；可靠技巧须至少3次且跨2天计时成功；失败保留并可降级。
    evidence_required:
