    target: 只修最可重复的失分
    action: 从TC/SE与reading_440各取未做题，35分钟块最多4题，55分钟块最多8题（约14分钟答题），45–50分钟块最多6题；先完成积压的完整逐项讲解，再做新题。
    output: 题型分开的原答/用时/证据/错因、未讲完题目队列
