principles:
  - 新词按时间和次日回忆率控制，不以刷完页数或列表为成功标准。
  - 标准日新词45至55个，最多65分钟；到点即停，剩余内容顺延但不形成惩罚性debt。
  - 新词次日、三日后、七日后主动回忆；连续3次正确才进入mastered。
  - 次日完全正确率大于等于85%时下一次最多55词，70%至84%时40至50词，低于70%时30至40词。
  - 每日保留Verbal题目应用、Quant训练和错因记录，词汇不得吞掉整天。
  - 完整模考不连续安排；每套约118分钟，下一日优先深度复盘。
  - Day24后原则上不追求大规模新词，只补题目中暴露的高频缺口。
