execution_rules:
  - 先按每日180分钟试排。周一至三各60分钟，周四至日最多180分钟。12月13日起减量。
  - 暂无全套考试或诊断安排。每项是真实训练，题组计时从实际开始算。
  - 除首日固定题号，后续优先最近错因的同型未见题，按题库顺序取最早可用题；使用内容ID去重。
  - 已经讲解的题覆盖全部选项。课后记录个人摘要和能在练习中复用的一个动作。
  - 进度、用时、分数和技巧状态以实际提交及核验为依据。
