principles:
  - 普通学习日的新词配额为120个，预计约140分钟；它是上限也是计划值，不因前一天欠量而翻倍。
  - 完整模考日降至60个新词，模考深度复盘日降至80个；Day28至Day30默认不再新增。
  - 新词必须在次日、三日后和七日后主动回忆；连续3次正确才进入mastered。
  - 连续两次次日完全正确率低于70%时，普通日新词降至100；连续两次达到85%且新词块未超过145分钟，才维持120。
  - 每日保留Verbal、Quant和错因记录；写作每5天左右一次，以替换当日部分V/Q训练的方式加入，不额外加时。
  - 题库没有独立答案时只做过程训练，正确率保持null；正式基线优先使用官方POWERPREP。
  - 默认Day27完成核心3000词；实际按连续未学词推进，遇到重复词时顺延到下一个未学词，最后一日到全书末词即停。
