  <title>请更新系统网页组件</title>
  <style>body{font-family:system-ui,sans-serif;margin:0;padding:64px 24px;color:#20252b;background:white;line-height:1.8}h1{font-size:23px}p{font-size:16px;color:#65716b}</style>

<body>
  <h1>请先更新系统网页组件</h1>
  <p>GRE 词库需要 Android 7.0 或更新版本，以及版本 111 或更新的 Android System WebView（部分手机由 Chrome 提供）。</p>
  <p>请在手机应用商店更新 Android System WebView 或 Chrome，再重新打开词库。你的本机学习记录不会因此被清空。</p>
  <p>若组件已是新版本，请关闭并重新打开应用；仍无法打开时，保留应用数据并联系开发者，不要卸载。</p>
</body>
